patch:
  schema_list:
    - schema: double_pinyin_flypy
    - schema: csa

  menu:
    page_size: 10
  switcher:
    hotkeys:
      - "Control+0"
    fold_options: true
    abbreviate_options: true
    caption: "【🐿️】"
    option_list_separator: "｜"

  ascii_composer:
    good_old_caps_lock: true
    switch_key:
      Caps_Lock: commit_code
      Shift_L: commit_code
      Shift_R: commit_code
      Control_L: noop
      Control_R: noop

  key_binder:
    bindings:
      - { when: composing, accept: Control+p, send: Up }
      - { when: composing, accept: Control+n, send: Down }
      - { when: composing, accept: Control+g, send: Escape }

  punctuator:
    full_shape:
      "!": { commit: "！" }
      '"': { pair: ["“", "”"] }
      "#": ["＃", "⌘"]
      "$": "￥"
      "%": "％"
      "&": "＆"
      "'": { pair: ["‘", "’"] }
      "(": "（"
      ")": "）"
      "*": ["＊", "・", "×"]
      "+": "＋"
      ",": { commit: "，" }
      "-": "－"
      .: { commit: "。" }
      "/": ["／", "÷"]
      ":": { commit: "：" }
      ";": { commit: "；" }
      "<": ["《", "〈", "«", "‹"]
      "=": "＝"
      ">": ["》", "〉", "»", "›"]
      "?": { commit: "？" }
      "@": "＠"
      "[": ["「", "【", "〔", "［"]
      "\\": ["、", "＼"]
      "]": ["」", "】", "〕", "］"]
      "^": { commit: "……" }
      _: "——"
      "`": "｀"
      "{": ["『", "〖", "｛"]
      "|": ["·", "｜", "§", "¦"]
      "}": ["』", "〗", "｝"]
      "~": "～"
    half_shape:
      "!": { commit: "！" }
      '"': { pair: ["“", "”"] }
      "#": "#"
      "$": "￥"
      "%": ["%", "％", "°", "℃"]
      "&": "&"
      "'": { pair: ["‘", "’"] }
      "(": "（"
      ")": "）"
      "*": ["·", "×"]
      "+": "+"
      ",": { commit: "，" }
      "-": { commit: "-" }
      .: { commit: "。" }
      "/": { commit: "、" }
      ":": { commit: "：" }
      ";": { commit: "；" }
      "<": { commit: "《" }
      "=": { commit: "=" }
      ">": { commit: "》" }
      "?": { commit: "？" }
      "@": "@"
      "[": { commit: "【" }
      "\\": { commit: "、" }
      "]": { commit: "】" }
      "^": { commit: "……" }
      _: "——"
      "`": "`"
      "{": "「"
      "|": "|"
      "}": "」"
      "~": "~"
